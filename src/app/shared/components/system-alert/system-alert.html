<div class="alert-stack">
  @for (m of notify.messages(); track m.id) {
    <div class="system-alert" [class.system-alert--danger]="m.kind === 'danger'" [class.system-alert--success]="m.kind === 'success'"
         (click)="dismiss(m.id)">
      {{ m.text }}
    </div>
  }
</div>

@if (notify.levelUpFlash(); as lvl) {
  <div class="level-up-overlay">
    <div class="level-up-content">
      <div class="level-up-label">[SYSTEM]</div>
      <div class="level-up-main">LEVEL UP</div>
      <div class="level-up-sub">You are now Level {{ lvl.level }}</div>
    </div>
  </div>
}

@if (notify.rankUpFlash(); as rk) {
  <div class="level-up-overlay level-up-overlay--rank">
    <div class="level-up-content">
      <div class="level-up-label">[SYSTEM]</div>
      <div class="level-up-main">RANK UP</div>
      <div class="level-up-sub">{{ rk.rank }}-Rank Hunter</div>
    </div>
  </div>
}
